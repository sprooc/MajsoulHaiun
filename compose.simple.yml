services:
  haiun:
    image: ${HAIUN_IMAGE:-haiun:local}
    build:
      context: .
      target: runtime
      args:
        PYPI_INDEX_URL: "${HAIUN_PYPI_INDEX_URL:-https://pypi.org/simple}"
    user: "0:0"
    entrypoint:
      - python
      - -m
      - app.docker_entrypoint
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --workers
      - "1"
    environment:
      HAIUN_CONFIG: /app/config/config.toml
      HAIUN_DATA_DIR: /data
      HAIUN_METRICS_ENABLED: "${HAIUN_METRICS_ENABLED:-false}"
    ports:
      - "${HAIUN_SIMPLE_PORT:-8765}:8765"
    volumes:
      - type: volume
        source: haiun-data
        target: /data
      - type: bind
        source: ${HAIUN_CONFIG_DIR:-./config}
        target: /app/config
        read_only: true
    tmpfs:
      - /run/haiun-config:mode=0711,uid=0,gid=0,noexec,nosuid,nodev
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  haiun-data:
    name: ${HAIUN_DATA_VOLUME:-haiun-data}
