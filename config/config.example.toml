timeout_seconds = 15

# The Amae-Koromo public index now requires a CAPTCHA token for the
# player_records endpoint (used for listing recent games). Contact SAPikachu
# to obtain a key, then uncomment and set cap_token below.
# [amae_koromo]
# cap_token = "your-captcha-token"

# Mahjong Soul accounts are tried from top to bottom. Keep the real file local
# and chmod 0600. These credentials are read only by the backend.
[[accounts]]
username = "first-account@example.com"
password = "replace-me"
host = "https://game.maj-soul.com"

[[accounts]]
username = "second-account@example.com"
password = "replace-me"
host = "https://game.maj-soul.com"

# The /admin page is deliberately unlinked. Use a long, unique password.
[admin]
password = "replace-with-a-long-unique-password"
session_hours = 12
