global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: haiun
    metrics_path: /metrics
    static_configs:
      - targets:
          - haiun:8765

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    static_configs:
      - targets:
          - nginx:12345
